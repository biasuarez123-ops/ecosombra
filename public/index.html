<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoSombra — Mapeamento de Sombra Urbana</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <!-- Estilos Próprios -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Barra de Navegação Superior -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-eco py-2">
    <div class="container-fluid px-3">
      <a class="navbar-brand d-flex align-items-center gap-2 brand-text fs-4" href="index.html">
        <span>🌿</span> EcoSombra
      </a>

      <!-- Campo de Busca de Endereço e Botão GPS -->
      <div class="d-flex flex-grow-1 mx-lg-4 my-2 my-lg-0" style="max-width: 540px;">
        <form class="input-group" onsubmit="handleAddressSearch(event)">
          <input
            type="text"
            id="searchAddressInput"
            class="form-control"
            placeholder="Buscar rua, praça ou bairro..."
            aria-label="Buscar endereço"
          >
          <button class="btn btn-light fw-semibold" type="submit" id="btnSearchAddress">
            Buscar
          </button>
        </form>
        <button
          type="button"
          class="btn btn-outline-light ms-2 text-nowrap d-flex align-items-center gap-1"
          id="btnGeoLocation"
          onclick="handleUseCurrentLocation()"
          title="Usar minha localização atual (GPS)"
        >
          📍 <span class="d-none d-sm-inline">Meu GPS</span>
        </button>
      </div>

      <!-- Área de Autenticação do Usuário -->
      <div id="userNavContainer" class="d-flex align-items-center">
        <!-- Renderizado dinamicamente via auth.js -->
        <span class="text-white-50 small">Carregando...</span>
      </div>
    </div>
  </nav>

  <!-- Container de Notificações Globais -->
  <div class="container-fluid px-3 pt-2">
    <div id="globalAlertContainer"></div>
  </div>

  <!-- Barra de Filtros e Visualização -->
  <div class="container-fluid px-3 py-2">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 bg-white p-2 rounded shadow-sm border">
      <div class="d-flex flex-wrap align-items-center gap-1">
        <span class="small fw-bold text-muted me-2">Filtrar Sombra:</span>
        <button class="btn btn-sm btn-dark btn-filter active" id="filter-todos" onclick="applyFilter('')">
          Todos
        </button>
        <button class="btn btn-sm btn-outline-secondary btn-filter" id="filter-pouca" onclick="applyFilter('pouca')">
          🟡 Pouca Sombra
        </button>
        <button class="btn btn-sm btn-outline-secondary btn-filter" id="filter-moderada" onclick="applyFilter('moderada')">
          🟢 Moderada
        </button>
        <button class="btn btn-sm btn-outline-secondary btn-filter" id="filter-muita" onclick="applyFilter('muita')">
          🌳 Muita Sombra
        </button>
      </div>

      <div class="d-flex align-items-center gap-2">
        <span class="badge bg-secondary" id="totalCountBadge">0 locais</span>
        <span class="small text-muted d-none d-md-inline">💡 Clique no mapa para cadastrar um novo ponto</span>
      </div>
    </div>
  </div>

  <!-- Área Principal: Mapa e Lista Integrados -->
  <div class="container-fluid px-3 pb-3">
    <div class="row g-3">
      <!-- Coluna do Mapa -->
      <div class="col-lg-8">
        <div class="bg-white p-2 rounded shadow-sm border">
          <div id="map"></div>
        </div>
      </div>

      <!-- Coluna da Lista de Locais -->
      <div class="col-lg-4">
        <div class="bg-white p-3 rounded shadow-sm border" style="height: calc(100vh - 200px); min-height: 480px; overflow-y: auto;">
          <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
            <h6 class="fw-bold mb-0 text-success">📋 Locais Cadastrados</h6>
            <button class="btn btn-sm btn-outline-success" onclick="loadShades(currentFilter)" title="Atualizar listagem">
              🔄 Atualizar
            </button>
          </div>
          <div id="shadesListContainer">
            <!-- Renderizado dinamicamente via app.js -->
            <div class="text-center py-4 text-muted">Carregando locais...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL: CADASTRAR NOVO LOCAL DE SOMBRA (RF03, RF04, RF12) -->
  <div class="modal fade" id="modalCreateShade" tabindex="-1" aria-labelledby="modalCreateShadeLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form id="formCreateShade">
          <div class="modal-header bg-success text-white">
            <h5 class="modal-title" id="modalCreateShadeLabel">🌳 Cadastrar Novo Local de Sombra</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label for="createTitulo" class="form-label fw-semibold">Título do Local *</label>
              <input type="text" class="form-control" id="createTitulo" placeholder="Ex: Praça das Flores, Banco sob a mangueira" required maxlength="120">
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold d-block">Classificação da Sombra *</label>
              <div class="d-flex gap-2">
                <div class="form-check flex-fill p-2 border rounded text-center">
                  <input class="form-check-input" type="radio" name="createNivelSombra" id="sombraPouca" value="pouca" required>
                  <label class="form-check-label d-block fw-semibold text-warning-emphasis" for="sombraPouca">
                    🟡 Pouca
                  </label>
                </div>
                <div class="form-check flex-fill p-2 border rounded text-center">
                  <input class="form-check-input" type="radio" name="createNivelSombra" id="sombraModerada" value="moderada" checked required>
                  <label class="form-check-label d-block fw-semibold text-success" for="sombraModerada">
                    🟢 Moderada
                  </label>
                </div>
                <div class="form-check flex-fill p-2 border rounded text-center">
                  <input class="form-check-input" type="radio" name="createNivelSombra" id="sombraMuita" value="muita" required>
                  <label class="form-check-label d-block fw-semibold text-success-emphasis" for="sombraMuita">
                    🌳 Muita
                  </label>
                </div>
              </div>
            </div>

            <div class="row g-2 mb-3">
              <div class="col-6">
                <label for="createLatitude" class="form-label small fw-semibold">Latitude *</label>
                <input type="number" step="any" class="form-control form-control-sm" id="createLatitude" required>
              </div>
              <div class="col-6">
                <label for="createLongitude" class="form-label small fw-semibold">Longitude *</label>
                <input type="number" step="any" class="form-control form-control-sm" id="createLongitude" required>
              </div>
            </div>

            <div class="mb-3">
              <label for="createEndereco" class="form-label small fw-semibold">Endereço ou Referência (Opcional)</label>
              <input type="text" class="form-control form-control-sm" id="createEndereco" placeholder="Ex: Rua Central, altura do número 120" maxlength="255">
            </div>

            <div class="mb-3">
              <label for="createDescricao" class="form-label small fw-semibold">Descrição ou Observações (Opcional)</label>
              <textarea class="form-control form-control-sm" id="createDescricao" rows="2" placeholder="Ex: Ótimo local com bancos de madeira e sombra fresca durante a tarde."></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-success fw-bold">Salvar Ponto de Sombra</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- MODAL: EDITAR LOCAL DE SOMBRA (RF10, RF11) -->
  <div class="modal fade" id="modalEditShade" tabindex="-1" aria-labelledby="modalEditShadeLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <form id="formEditShade">
          <input type="hidden" id="editId">
          <div class="modal-header bg-primary text-white">
            <h5 class="modal-title" id="modalEditShadeLabel">✏️ Editar Local de Sombra</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Fechar"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label for="editTitulo" class="form-label fw-semibold">Título do Local *</label>
              <input type="text" class="form-control" id="editTitulo" required maxlength="120">
            </div>

            <div class="mb-3">
              <label class="form-label fw-semibold d-block">Classificação da Sombra *</label>
              <div class="d-flex gap-2">
                <div class="form-check flex-fill p-2 border rounded text-center">
                  <input class="form-check-input" type="radio" name="editNivelSombra" id="editSombraPouca" value="pouca" required>
                  <label class="form-check-label d-block fw-semibold text-warning-emphasis" for="editSombraPouca">
                    🟡 Pouca
                  </label>
                </div>
                <div class="form-check flex-fill p-2 border rounded text-center">
                  <input class="form-check-input" type="radio" name="editNivelSombra" id="editSombraModerada" value="moderada" required>
                  <label class="form-check-label d-block fw-semibold text-success" for="editSombraModerada">
                    🟢 Moderada
                  </label>
                </div>
                <div class="form-check flex-fill p-2 border rounded text-center">
                  <input class="form-check-input" type="radio" name="editNivelSombra" id="editSombraMuita" value="muita" required>
                  <label class="form-check-label d-block fw-semibold text-success-emphasis" for="editSombraMuita">
                    🌳 Muita
                  </label>
                </div>
              </div>
            </div>

            <div class="row g-2 mb-3">
              <div class="col-6">
                <label for="editLatitude" class="form-label small fw-semibold">Latitude *</label>
                <input type="number" step="any" class="form-control form-control-sm" id="editLatitude" required>
              </div>
              <div class="col-6">
                <label for="editLongitude" class="form-label small fw-semibold">Longitude *</label>
                <input type="number" step="any" class="form-control form-control-sm" id="editLongitude" required>
              </div>
            </div>

            <div class="mb-3">
              <label for="editEndereco" class="form-label small fw-semibold">Endereço (Opcional)</label>
              <input type="text" class="form-control form-control-sm" id="editEndereco" maxlength="255">
            </div>

            <div class="mb-3">
              <label for="editDescricao" class="form-label small fw-semibold">Descrição (Opcional)</label>
              <textarea class="form-control form-control-sm" id="editDescricao" rows="2"></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary fw-bold">Salvar Alterações</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/map.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
