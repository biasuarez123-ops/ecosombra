<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acessar Conta — EcoSombra</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #f0fdf4 0%, #dcfce7 100%);
    }
    .auth-card {
      width: 100%;
      max-width: 440px;
      border: none;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }
    .nav-pills .nav-link.active {
      background-color: var(--eco-primary);
    }
    .nav-pills .nav-link {
      color: #374151;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5">

        <div class="text-center mb-4">
          <a href="index.html" class="text-decoration-none">
            <h2 class="fw-bold text-success d-flex align-items-center justify-content-center gap-2">
              <span>🌿</span> EcoSombra
            </h2>
          </a>
          <p class="text-muted small">Mapeamento colaborativo de sombra urbana</p>
        </div>

        <div class="card auth-card p-4 bg-white">
          <!-- Alertas -->
          <div id="authAlert"></div>

          <!-- Abas para alternar entre Login e Cadastro -->
          <ul class="nav nav-pills nav-fill mb-4 p-1 bg-light rounded" id="authTabs" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active" id="tab-login" data-bs-toggle="pill" data-bs-target="#pane-login" type="button" role="tab">
                Entrar
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link" id="tab-register" data-bs-toggle="pill" data-bs-target="#pane-register" type="button" role="tab">
                Criar Conta
              </button>
            </li>
          </ul>

          <div class="tab-content" id="authTabsContent">
            <!-- ABA: LOGIN (RF02, CA02) -->
            <div class="tab-pane fade show active" id="pane-login" role="tabpanel">
              <form id="formLogin">
                <div class="mb-3">
                  <label for="loginEmail" class="form-label fw-semibold">E-mail</label>
                  <input type="email" class="form-control" id="loginEmail" placeholder="seu@email.com" required>
                </div>
                <div class="mb-3">
                  <label for="loginSenha" class="form-label fw-semibold">Senha</label>
                  <input type="password" class="form-control" id="loginSenha" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold py-2 mt-2" id="btnLoginSubmit">
                  Acessar Plataforma
                </button>
              </form>
            </div>

            <!-- ABA: CADASTRO (RF01, CA01) -->
            <div class="tab-pane fade" id="pane-register" role="tabpanel">
              <form id="formRegister">
                <div class="mb-3">
                  <label for="regNome" class="form-label fw-semibold">Nome Completo</label>
                  <input type="text" class="form-control" id="regNome" placeholder="Ex: Maria Santos" required minlength="2">
                </div>
                <div class="mb-3">
                  <label for="regEmail" class="form-label fw-semibold">E-mail</label>
                  <input type="email" class="form-control" id="regEmail" placeholder="seu@email.com" required>
                </div>
                <div class="mb-3">
                  <label for="regSenha" class="form-label fw-semibold">Senha</label>
                  <input type="password" class="form-control" id="regSenha" placeholder="Mínimo 6 caracteres" required minlength="6">
                  <div class="form-text">A senha deve ter pelo menos 6 caracteres.</div>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold py-2 mt-2" id="btnRegisterSubmit">
                  Finalizar Cadastro
                </button>
              </form>
            </div>
          </div>

          <div class="text-center mt-4 pt-3 border-top">
            <a href="index.html" class="text-decoration-none text-muted small">
              ← Voltar ao mapa sem entrar
            </a>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script>
    const alertBox = document.getElementById('authAlert');

    function showAlert(msg, type = 'danger') {
      alertBox.innerHTML = `
        <div class="alert alert-${type} alert-dismissible fade show small" role="alert">
          ${msg}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      `;
    }

    // Formulário de Login
    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const senha = document.getElementById('loginSenha').value;
      const btn = document.getElementById('btnLoginSubmit');

      btn.disabled = true;
      btn.innerHTML = 'Acessando...';

      try {
        await authAPI.login(email, senha);
        window.location.href = 'index.html';
      } catch (err) {
        showAlert(err.message, 'danger');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Acessar Plataforma';
      }
    });

    // Formulário de Cadastro
    document.getElementById('formRegister').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nome = document.getElementById('regNome').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const senha = document.getElementById('regSenha').value;
      const btn = document.getElementById('btnRegisterSubmit');

      btn.disabled = true;
      btn.innerHTML = 'Cadastrando...';

      try {
        await authAPI.register(nome, email, senha);
        showAlert('Cadastro realizado com sucesso! Redirecionando...', 'success');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1000);
      } catch (err) {
        showAlert(err.message, 'danger');
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Finalizar Cadastro';
      }
    });
  </script>
</body>
</html>
